services:
  # ==========================================
  # 1. DISTRIBUTED REDIS 7 PUB/SUB & CACHE
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: jandj-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - jandj_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  # 2. BLUE APPLICATION INSTANCE
  # ==========================================
  app_blue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jandj-web-blue
    restart: unless-stopped
    environment:
      - PORT=5167
      - INSTANCE_COLOR=blue
      - REDIS_ADDR=redis:6379
      - ADMIN_PIN=${ADMIN_PIN:-2026}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
    volumes:
      - wedding_uploads:/app/uploads
      - wedding_data:/app/data
    networks:
      - jandj_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5167/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  # 3. GREEN APPLICATION INSTANCE
  # ==========================================
  app_green:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jandj-web-green
    restart: unless-stopped
    environment:
      - PORT=5168
      - INSTANCE_COLOR=green
      - REDIS_ADDR=redis:6379
      - ADMIN_PIN=${ADMIN_PIN:-2026}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
    volumes:
      - wedding_uploads:/app/uploads
      - wedding_data:/app/data
    networks:
      - jandj_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5168/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  # 4. NGINX ZERO-DOWNTIME REVERSE PROXY
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: jandj-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:rw
    networks:
      - jandj_net
      - tunnel-net
    depends_on:
      - app_blue
      - app_green

networks:
  jandj_net:
    driver: bridge
  tunnel-net:
    external: true

volumes:
  redis_data:
  wedding_uploads:
  wedding_data:
